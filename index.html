<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سيستم محتوى الجباره</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F4F6F2;--bg2:#E9EEE7;--card:#fff;--ink:#12261D;--ink2:#47594F;--ink3:#76867D;--line:#D6DDD3;--g:#004825;--gold:#F89F37;--goldsoft:#FEEFD9;--gink:#fff;--warn:#7A4A00;--ok:#1E7A46;--oksoft:#E3F3EA;--bad:#B3361F;--badsoft:#FBE9E5;
--f:'IBM Plex Sans Arabic',Tahoma,'Segoe UI',sans-serif;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1712;--bg2:#13211A;--card:#172820;--ink:#E8EFE9;--ink2:#A6B6AD;--ink3:#7C8C83;--line:#2A3C33;--g:#6CCB97;--goldsoft:#2E2312;--gink:#06150D;--warn:#F8B45A;--ok:#6CCB97;--oksoft:#143324;--bad:#FF9A85;--badsoft:#3A1E18;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1712;--bg2:#13211A;--card:#172820;--ink:#E8EFE9;--ink2:#A6B6AD;--ink3:#7C8C83;--line:#2A3C33;--g:#6CCB97;--goldsoft:#2E2312;--gink:#06150D;--warn:#F8B45A;--ok:#6CCB97;--oksoft:#143324;--bad:#FF9A85;--badsoft:#3A1E18;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.8 var(--f);min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg2);z-index:50}
h1,h2,h3{font-family:var(--f);font-weight:700;line-height:1.3;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));overflow-y:auto;background:var(--bg2);border-inline-end:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:16px}
.mark{display:flex;gap:10px;align-items:center;padding-inline:8px}
.mark img{width:38px;height:38px}
.mark b{font-size:22px}.mark small{display:block;color:var(--ink3);font-size:12px;line-height:1.3}
.wm{display:grid;gap:4px;padding-inline:8px;justify-items:start}.wm img{width:176px;height:auto}.wm small{font-size:14px;font-weight:600;color:var(--ink2)}.wd{display:none}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wl{display:none}:root:not([data-theme="light"]) .wd{display:block}}:root[data-theme="dark"] .wl{display:none}:root[data-theme="dark"] .wd{display:block}
.grp{display:grid;gap:2px}.grp>span{font-size:12px;color:var(--ink3);padding-inline:10px;margin-bottom:2px}
.nl{display:flex;gap:8px;align-items:center;text-decoration:none;color:var(--ink2);padding:6px 10px;border-radius:9px;font-size:14.5px}
.nl:hover{background:var(--card);color:var(--ink)}
.nl[aria-current="page"]{background:var(--g);color:var(--gink);font-weight:600}
.nl em{margin-inline-start:auto;font-style:normal;font-size:12px;opacity:.75}
.sfoot{margin-top:auto;font-size:12px;color:var(--ink3);padding-inline:8px}
main{min-width:0;padding:28px clamp(16px,4vw,44px) 80px}
.view{max-width:1100px;margin-inline:auto}
.shead{padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:20px}
.shead h1{font-size:28px}.shead p{margin:4px 0 0;color:var(--ink2);max-width:70ch}
h2{font-size:18px;margin:26px 0 10px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card h3{font-size:16px;margin-bottom:4px}.card p,.card li{margin:0;color:var(--ink2);font-size:14.5px}.card ul{margin:0;padding-inline-start:18px}
.st{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}.st b{display:block;font-size:30px;line-height:1.1}.st span{font-size:13px;color:var(--ink2)}
.st.hot{border-color:var(--gold);background:var(--goldsoft)}
.tag{display:inline-block;font-size:12px;padding:0 9px;border-radius:99px;border:1px solid var(--gold);background:var(--goldsoft);color:var(--warn);font-weight:500;white-space:nowrap}
.tag.g{border-color:var(--g);background:transparent;color:var(--g)}
.note{background:var(--goldsoft);border:1px solid var(--gold);border-radius:10px;padding:10px 14px;margin:14px 0;font-size:14.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.row .t{flex:1;min-width:180px}.row .t small{display:block;color:var(--ink3)}
.btn{border:1px solid var(--g);background:var(--g);color:var(--gink);border-radius:8px;padding:4px 12px;cursor:pointer;font-size:14px;font-weight:500}
.btn.o{background:transparent;color:var(--g)}.btn.r{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn:hover{filter:brightness(1.08)}
select,input,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 10px;max-width:100%}
textarea{width:100%;min-height:64px}
.form{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin:10px 0}
.form label{display:grid;gap:2px;font-size:13px;color:var(--ink2)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:540px;background:var(--card);border:1px solid var(--line);font-size:14.5px}
th,td{padding:8px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}th{background:var(--bg2);font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{font-size:12.5px;color:var(--ink3);text-align:center;padding:2px}
.day{min-height:84px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.day.out{opacity:.45}.day.today{border:2px solid var(--gold)}
.day .n{font-size:12.5px;color:var(--ink2);display:flex;justify-content:space-between;gap:4px}
.day .o{font-size:10.5px;color:var(--warn);line-height:1.3}
.chip{font-size:11.5px;line-height:1.35;border-radius:5px;padding:1px 5px;border:0;text-align:start;cursor:pointer;background:var(--bg2);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chip.s4,.chip.s5{background:var(--oksoft);color:var(--ok)}.chip.s1,.chip.s3{background:var(--goldsoft);color:var(--warn)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:2px 12px;cursor:pointer;font-size:13.5px}.chips button[aria-pressed="true"]{background:var(--g);color:var(--gink);border-color:var(--g)}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;place-items:center}.tile img{max-width:100%;max-height:170px;height:auto}
.sw{border-radius:12px;padding:64px 14px 10px;display:flex;justify-content:space-between;font-weight:600;border:1px solid var(--line)}
code{direction:ltr;unicode-bidi:isolate;font:500 13.5px ui-monospace,Menlo,monospace}

<h2>الألوان الأساسية</h2><div class="grid"><div class="sw" style="background:#004825;color:#fff"><span>أخضر</span><code>#004825</code></div><div class="sw" style="background:#F89F37;color:#1b1b1b"><span>برتقالي</span><code>#F89F37</code></div></div>
<h2>الخطوط</h2><div class="slot"><h3>خط المتجر وخط العناوين</h3><p>لا أستطيع قراءة اسم الخط من الموقع بأدواتي. أحتاج اسمه من إعدادات الخطوط في زد أو من مصمم الهوية.</p><span class="tag">بانتظار الاسم</span></div>
<h2>ما يتكرر في تصاميمكم الحالية</h2><div class="card"><ul><li>الشعار في الأعلى، غالبًا في المنتصف، وأحيانًا في اليمين أو اليسار.</li><li>هوك قصير بخط عناوين عريض، برتقالي أو أبيض أو أخضر حسب الخلفية.</li><li>شريط سفلي ثابت: أيقونات المنصات واسم الحساب aljubarahmarket، وشعار «منقينه نقوة» مع الموقع.</li><li>شارات: «جديد»، و«٣٥ سنة خبرة»، وشارة هوك بجانب المنتج.</li><li>المنتج هو البطل، وغالبًا في اليد أو على سطح مع عناصر من الأحساء: سعف النخيل والخوص والفنجان السعودي.</li><li>لون الخلفية يتغير حسب المنتج: عنابي، أخضر داكن، بيج، أزرق سماوي، أبيض. ولا يقتصر على الأخضر والبرتقالي.</li></ul></div><div class="note">الملاحظات من الصور الستة في بنك الصور. نحتاج قرارًا: هل لون الخلفية حر لكل منتج، أم يُقيَّد بلوحة معتمدة؟ وكذلك موضع الشعار.</div>
<h2>الموود بورد</h2><p style="color:var(--ink2)">لكل فئة وصف اتجاه تكتبينه، ويُحفظ في هذا المتصفح. المراجع المصورة تُرفع في مشروع Claude.</p>${charsSec()}<h2>فئات الموود بورد</h2><div class="grid">${cats.map((c,i)=>`<div class="slot"><h3>${c[0]}</h3><p>${c[1]}. <span class="tag">لا مراجع بعد</span></p><textarea data-chg="nt" data-v="${i}" placeholder="اكتبي الاتجاه المطلوب">${esc(S.notes[i]||'')}</textarea></div>`).join('')}</div>

brief(){return head('البراند','بريف الجباره. ما ورد في الملف يُنقل كما هو، وما وصفه الملف بأنه مقترح يبقى مقترحًا.')+
`<div class="grid"><div class="card"><h3>نبذة</h3><p>الاسم الرسمي: «أسواق الجباره». علامة سعودية مسجلة منذ أكثر من ٣٥ سنة في القهوة والبهارات والحبوب والبقوليات. المتجر في الأحساء، منطقة الرفعة الشمالية بالهفوف. ترتبط بالمنتجات الحساوية والقهوة السعودية والتمور والأرز الحساوي.</p></div><div class="card"><h3>الفكرة الاستراتيجية (مقترحة)</h3><p>«أصالة الأحساء في تفاصيل سفرتك اليومية». صياغة مقترحة وليست شعارًا رسميًا.</p></div><div class="card"><h3>عبارات التواصل</h3><p>«منقينه نقوة»، و«صنع بحب من الجباره».</p></div><div class="card"><h3>الشخصية (مقترحة)</h3><ul><li>أصيلة</li><li>كريمة</li><li>موثوقة</li><li>قريبة من الناس</li><li>حسية</li><li>معاصرة</li></ul></div><div class="card"><h3>القيم</h3><ul><li>الأصالة المحلية</li><li>الاهتمام بالتفاصيل</li><li>تنوع الاستخدامات</li><li>الضيافة والكرم</li><li>الثقة والوضوح</li><li>سهولة الاستخدام</li><li>الاحتفاء بالمذاق الحساوي والسعودي</li></ul></div><div class="card"><h3>الوعد</h3><p>منتجات تختارها لسفرتك، ونكهات تجعل تفاصيلها أقرب إلى ذوقك. أي وعد عن الجودة أو المصدر أو المكونات يُربط بمعلومة موثقة لكل منتج.</p></div></div>
<h2>المنتجات</h2><div class="grid"><div class="card"><h3>المنتجات الحساوية</h3><ul><li>التمور وعجينة التمر ودبس التمر</li><li>الأرز الحساوي الأحمر</li><li>اللومي الحساوي: مخلل، جميد، بهار</li></ul></div><div class="card"><h3>القهوة والشاي</h3><ul><li>الجباره الملكية والبن الممتاز</li><li>القهوة السعودية والتركية والفرنسية</li><li>قهوة الشعير وبهار القهوة والكركديه</li></ul></div><div class="card"><h3>البهارات والمساندة</h3><ul><li>بهارات مطحونة وحب وخلطات</li><li>دبس الرمان والطحينية ومنتجات الخبز</li><li>المكسرات والبقوليات والمكرونة وغيرها (ليست كلها بعلامة الجباره)</li></ul></div><div class="card"><h3>أساسيات المطبخ الحساوي</h3><ul><li>الهريس: عراقي ٢ كيلو ١٦ ر.س، و١٠ كيلو ٧٠ ر.س (بدل ٨٠)</li><li>الجريش: أبيض ٢ كيلو ١٢ ر.س، ومحمص ١٥ ر.س</li><li>دقيق لقيمات الجباره: ١.٥ كيلو ١١ ر.س، و٩ كيلو ٤٠ ر.س</li></ul><p style="margin-top:6px">أسعار المتجر في ٢٥ أكتوبر ٢٠٢٦، وتُؤكد قبل الاستخدام.</p></div></div>
<h2>الجمهور</h2><div class="grid"><div class="card"><h3>الأساسي</h3><ul><li>الأسر السعودية</li><li>المهتمون بالمطبخ الحساوي والسعودي</li><li>محبو القهوة والضيافة</li><li>المهتمون بالطهي والوصفات</li><li>مشترو الهدايا والباقات</li></ul></div><div class="card"><h3>التجاري (مؤجل)</h3><p>مقاهٍ ومطاعم وجملة. ورد في البريف، وقرارنا الحالي تأجيله.</p></div></div>

flow(){const s=(t,b,g)=>`<details class="step${g?' gate':''}"><summary>${t}</summary><div>${b}</div></details>`;return head('رحلة القطعة','من البحث إلى القياس. اعتمادان ثابتان، واتجاه التصميم اختياري.')+s('١ البحث والاستلهام','<p>قراءة المتجر والمنافسين، ثم بنك الأفكار وبنك الصور. نستلهم المبدأ ولا ننسخ.</p>')+s('٢ اقتراح الفكرة والنصوص','<p>Claude يكتب الفكرة الرئيسية، وثلاثة هوكات (٣ إلى ٧ كلمات)، والكابشن، ونص التصميم، والسكريبت أو شرائح الكاروسيل.</p>')+s('٣ بطاقة الفكرة (اعتماد ١)','<p>تعتمدها آيات. لا انتقال قبل الاعتماد.</p>',1)+s('٤ اتجاه التصميم (اختياري)','<p>مراجع من بنك الصور، وأصول من المكتبة، وبرومبت بالأسئلة السبعة (وبرومبت لكل مشهد في الريلز)، وفحص الهوية. اعتماد الاتجاه اختياري لكل قطعة.</p>')+s('٥ التصميم','<p>Claude Design يركّب القطعة من الصورة الحقيقية والماستر برومبت. الخلفيات المولدة من أداة خارجية.</p>')+s('٦ مراجعة التصميم (اعتماد ٢)','<p>تعتمدها آيات، بعد قائمة فحص الهوية.</p>',1)+s('٧ الجدولة والنشر','<p>عبر برنامج جدولة سيُربط. اسمه بانتظار التأكيد.</p>')+s('٨ القياس بعد ٧ أيام','<p>تُسجَّل الأرقام في «سجل الأداء»، ويعود الناجح إلى بنك الأفكار وبنك الصور.</p>')+`<div class="note">المقالات لها مسار مستقل بثلاثة اعتمادات، في تبويب المقالات.</div>`},
rivals(){return '<h2>المنافسون</h2>'+`<div class="grid">${['esnadfoods','alhawanstore','algharbisa','sorrah_sa','qatfaalmosem'].map(a=>`<div class="card"><h3>${a}</h3><p>إنستغرام</p></div>`).join('')}</div><div class="note">إنستغرام يمنع الوصول الآلي. أحتاج لقطات أو روابط منشورات أو أرقامًا مصدّرة.</div><h2>أوقات النشر المبدئية</h2><div class="scroll"><table><tr><th>المنصة</th><th>الوقت</th><th>ملاحظة</th></tr><tr><td>إنستغرام</td><td>٣ إلى ٥ مساءً</td><td>السبت أفضل الأيام في أحد المصادر</td></tr><tr><td>تيك توك</td><td>٨ إلى ١٠ مساءً</td><td>بيانات عامة للسوق السعودي</td></tr><tr><td>سناب شات</td><td>لا بيانات موثوقة</td><td>تُحدد بعد أول تقرير</td></tr></table></div>`},
qc(){return head('فحص الجودة')+`<div class="card chk">${['اسم العلامة «الجباره» بالهاء','اسم المنتج ووزنه ومعلوماته صحيحة','السعر والعرض مؤكدان من المتجر','اللهجة سعودية بيضاء طبيعية','للقطعة هدف وكود فكرة','Alt text بالكلمات المفتاحية','العبوة والشعار كما في الأصل','لا ادعاءات صحية غير موثقة','المقاس مناسب للمنصة'].map(x=>`<label><input type="checkbox"><span>${x}</span></label>`).join('')}</div>`},
start(){return head('ابدأ والجاهزية','هذه الصفحة هي المرجع، والتشغيل يتم في مشروع Claude.')+`<div class="card"><ul><li>أنشئي مشروعًا وارفعي دليل التشغيل والبريف والشعار وصور العبوات، وضعي الـMaster Prompt في التعليمات.</li><li>ابني قاعدة معلومات أعلى عشرة منتجات.</li><li>جرّبي دورة كاملة على ثلاثة منتجات.</li><li>راجعي وعدّلي، ثم ابدئي التقويم الشهري.</li></ul></div><h2>جاهزية العرض على المدير</h2><div class="card chk">${['الشعار والألوان في السيستم','خط المتجر مضاف','المفردات المعتمدة مكتوبة','قاعدة معلومات أعلى عشرة منتجات','صور العبوات في المكتبة','تجربة دورة كاملة على ثلاثة منتجات','أدوار الاعتماد مؤكدة'].map(x=>`<label><input type="checkbox"><span>${x}</span></label>`).join('')}</div>`}
};
const _brief=V.brief;V.brief=()=>_brief()+V.voice()+V.rivals();
const NAV=[['العلامة',[['brief','البراند والصوت والمنافسين'],['brand','الهوية والموود بورد'],['strat','استراتيجية المحتوى']]],['الرئيسية',[['dash','لوحة اليوم',()=>pend().length+post().length+arts().length]]],['المحتوى',[['drafts','المسودات',()=>drafts().length],['ideas','بنك الأفكار',()=>S.bank.length+IDEAS.length],['imgs','بنك الصور',()=>S.imgs.length],['designs','ستوديو التصميمات',()=>S.designs.length],['reels','ستوديو الريلز',()=>S.items.filter(i=>i.k=='ريلز').length],['lib','المكتبة البصرية',()=>lib().length+S.assets.length],['prod','المنتجات والباقات',()=>S.prods.filter(p=>stage(p)=='جديدة').length],['art','المقالات',()=>S.items.filter(i=>i.k=='مقال').length],['mp','الماستر برومبت'],['pgen','مولّد البرومبتات'],['perf','سجل الأداء',()=>due()]]],['التشغيل',[['flow','رحلة القطعة'],['qc','الجودة'],['start','ابدأ والجاهزية']]]];
let cur='brief';
function render(){document.getElementById('nav').innerHTML=NAV.map(g=>`<div class="grp"><span>${g[0]}</span>${g[1].map(n=>`<a class="nl" href="#${n[0]}" ${n[0]==cur?'aria-current="page"':''}>${n[1]}${n[2]?`<em>${n[2]()}</em>`:''}</a>`).join('')}</div>`).join('');
document.getElementById('v').innerHTML=V[cur]();save()}
function route(){let h=location.hash.slice(1);if(h=='plan26'||h=='q1'){S.ss=h=='q1'?'q1':'26';h='strat'}cur=V[h]?h:'brief';render();window.scrollTo(0,0)}
addEventListener('hashchange',route);
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id,it=by(id);let keep=1;
if(a=='adv'&&it){const s=stg(it);it.s=s[Math.min(s.indexOf(it.s)+1,s.length-1)]}
else if(a=='back'&&it){const s=stg(it);it.s=s[Math.max(s.indexOf(it.s)-1,0)]}
else if(a=='del'){S.items=S.items.filter(i=>i.id!=id);S.sel=0}
else if(a=='sel')S.sel=+id;
else if(a=='mp'){S.cm=S.cm[1]?[S.cm[0],S.cm[1]-1]:[S.cm[0]-1,11]}
else if(a=='mn'){S.cm=S.cm[1]<11?[S.cm[0],S.cm[1]+1]:[S.cm[0]+1,0]}
else if(a=='lf')S.lf=b.dataset.v;
else if(a=='radd'){const x=g('rt').trim();if(x)S.items.push({id:++uid,t:x,k:'ريلز',p:g('rp')||'إنستغرام',prod:g('rr'),s:'فكرة',o:g('ro')||'يحيى',d:g('rd')||TD,idea:'',ob:'وعي'})}
else if(a=='cpx'){const el=document.getElementById(b.dataset.t);try{navigator.clipboard.writeText(el.value);b.textContent='تم النسخ'}catch(e){el.select();b.textContent='ظلّلت النص، انسخيه'}keep=0}
else if(a=='msave'&&it)it.s='تم القياس';
else if(a=='m2b'&&it){const m=it.m||{};S.bank.push({id:++uid,ob:it.ob||'وعي',h:m.w&&m.w!='—'?m.w:(it.h1||it.t),cp:it.cp||'',cta:'',k:it.k=='صورة'?'بوست':it.k,p:it.prod||'',s:'فريق الجباره',by:'Claude',l:+m.l||0,c:+m.c||0,sv:+m.sv||0,sh:+m.sh||0,f:+S.fol[it.p]||0,v:+m.v||0,n:'قطعة منشورة من الجباره'})}
else if(a=='m2i'&&it){const m=it.m||{};S.imgs.push({id:++uid,t:it.t,k:it.k=='ريلز'?'ريلز':'تصميم',p:it.p,s:'الجباره',b:'Claude',pr:it.prod||'',l:'',w:'أداؤه: '+(m.v||'—')+' مشاهدة',f:'نعم',tk:'',th:''})}
else if(a=='ss')S.ss=b.dataset.v;
else if(a=='asadd'){const x=g('asn').trim();if(x)S.assets.push({id:++uid,t:x,c:g('asc'),n:g('asm'),th:''})}
else if(a=='asdel')S.assets=S.assets.filter(q=>q.id!=id);
else if(a=='chadd'){const x=g('chn').trim();if(x)S.chars.push({id:++uid,n:x,rows:[['الوصف',g('chd')]],note:'',t1:'',t2:''})}
else if(a=='chdel')S.chars=S.chars.filter(q=>q.id!=id);
else if(a=='df')S.df=b.dataset.v;
else if(a=='dsadd'){const x=g('dst').trim();if(x)S.designs.push({id:++uid,t:x,c:g('dsc'),prod:g('dsp'),l:g('dsl'),s:'مسودة'})}
else if(a=='dsadv'){const d=S.designs.find(q=>q.id==id);if(d)d.s='معتمد'}
else if(a=='dsdel')S.designs=S.designs.filter(q=>q.id!=id);
else if(a=='mpafill'){S.mpa=MPA}
else if(a=='of')S.of=b.dataset.v;
else if(a=='pf')S.pf=b.dataset.v;
else if(a=='pmove'){const p=S.prods.find(x=>x.id==id);if(p)p.nw=0}
else if(a=='pnew'){const n=g('pn').trim();if(n)S.prods.push({id:++uid,n,cat:g('pc')||'غير مصنف',pr:+g('pp')||0,old:0,nw:1,added:g('pdt')});S.pf='جديدة'}
else if(a=='tk'){const t=S.tickets.find(x=>x.id==id);if(t)t.done=1}
else if(a=='tkadd'){const t=document.getElementById('tkt').value.trim();if(t)S.tickets.push({id:++uid,t,o:document.getElementById('tko').value,done:0})}
else if(a=='add'){const t=document.getElementById('nt').value.trim();if(t)S.items.push({id:++uid,t,k:nk.value,p:nk.value=='مقال'?'المدونة':np.value,prod:nr.value,s:'فكرة',o:no.value,d:nd.value||TD,idea:''})}
else if(a=='mk'){const x=IDEAS.find(q=>q[0]==b.dataset.v);if(x)S.items.push({id:++uid,t:x[2],k:x[3],p:x[3]=='مقال'?'المدونة':'إنستغرام',prod:'',s:'فكرة',o:'آيات',d:off(7),idea:x[0],ob:x[4]})}
else if(a=='bkadd'){const x=g('bh').trim();if(x)S.bank.push({id:++uid,ob:g('bo'),h:x,cp:g('bc'),cta:g('bt'),k:g('bk'),p:g('bp'),s:g('bs'),by:g('bb'),l:+g('bli')||0,c:+g('bco')||0,sv:+g('bsv')||0,sh:+g('bsh')||0,f:+g('bf')||0,v:+g('bv')||0,n:g('bn'),u:g('bl')})}
else if(a=='bkdel')S.bank=S.bank.filter(x=>x.id!=id);
else if(a=='bk2cal'){const x=S.bank.find(q=>q.id==id);if(x)S.items.push({id:++uid,t:x.h,k:x.k,p:'إنستغرام',prod:x.p,s:'فكرة',o:'آيات',d:off(7),idea:'',h1:x.h,cp:x.cp,ob:x.ob})}
else if(a=='imadd'){const x=g('it').trim();if(x)S.imgs.push({id:++uid,t:x,k:g('ik'),p:g('ip'),s:g('is'),b:g('ib'),pr:g('ipr'),l:g('il'),w:g('iw'),f:g('ifit'),tk:g('itk')})}
else if(a=='imdel')S.imgs=S.imgs.filter(x=>x.id!=id);
else if(a=='mpfill'){S.mpd=MP}
else if(a=='cp'){try{navigator.clipboard.writeText(MP);b.textContent='تم النسخ'}catch(e){const r=document.createRange();r.selectNodeContents(document.getElementById('mpt'));const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='ظلّلت النص، انسخيه'}keep=0}
else if(a=='reset'){S=seed()}
else keep=0;
if(keep)render()});
document.addEventListener('change',e=>{const t=e.target,c=t.dataset.chg;if(!c)return;const it=by(t.dataset.id);
if(c=='st'&&it)it.s=t.value;else if(c=='ow'&&it)it.o=t.value;else if(c=='dt'&&it)it.d=t.value;else if(c=='role')S.role=t.value;else if(c=='nt')S.notes[t.dataset.v]=t.value;else if(c=='f'&&it)it[t.dataset.f]=t.value;else if(c=='mpd')S.mpd=t.value;else if(c=='pg'){const o=it?(it.pg=it.pg||{}):S.pgf;o[t.dataset.f]=t.value=='—'?'':t.value}
else if(c=='ref'&&it){const a=it.refs=it.refs||[],v=+t.dataset.v,k=a.indexOf(v);if(t.checked&&k<0)a.push(v);if(!t.checked&&k>=0)a.splice(k,1)}
else if(c=='as'&&it){const a=it.as=it.as||[],v=t.dataset.v,k=a.indexOf(v);if(t.checked&&k<0)a.push(v);if(!t.checked&&k>=0)a.splice(k,1)}
else if(c=='qc'&&it){(it.qc=it.qc||{})[t.dataset.v]=t.checked}
else if(c=='dok'&&it)it.dok=t.checked;
else if(c=='m'&&it){(it.m=it.m||{})[t.dataset.f]=t.value=='—'?'':t.value}
else if(c=='fol')S.fol[t.dataset.v]=t.value;
else if(c=='cfgart')S.cfg.art=Math.max(1,+t.value||4);else if(c=='sz')S.sizes[t.dataset.v]=t.value;else if(c=='shot'){S.shots[t.dataset.id]=S.shots[t.dataset.id]||{};S.shots[t.dataset.id][t.dataset.v]=t.checked}else if(c=='chk')S.chk[t.dataset.v]=t.checked;else if(c=='kpi'){const k=S.kpi[t.dataset.k]=S.kpi[t.dataset.k]||{},o=k[t.dataset.v]=k[t.dataset.v]||{};o[t.dataset.f]=t.value}else if(c=='mpa')S.mpa=t.value;else if(c=='pd'){const p=S.prods.find(x=>x.id==t.dataset.id);if(p)p.added=t.value}else if(c=='cap')S.cap[t.dataset.v]=t.value;
if(c=='q'){S.q=t.value}
if(c!='nt'&&c!='f'&&c!='mpd'&&c!='mpa'&&c!='cap'&&c!='kpi'&&c!='chk'&&c!='sz'&&c!='cfgart'&&c!='ref'&&c!='as'&&c!='dok'&&c!='m'&&c!='fol')render();else save()});
route();
</script>
</body>
</html>
